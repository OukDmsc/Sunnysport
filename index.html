<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receipt</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Zoom Controls -->
    <div class="zoom-controls">
      <button id="zoomOutBtn" class="zoom-btn" title="Zoom out (Ctrl/Cmd + -)" aria-label="Zoom out">−</button>
      <span id="zoomLevel" class="zoom-level">100%</span>
      <button id="zoomInBtn" class="zoom-btn" title="Zoom in (Ctrl/Cmd + +)" aria-label="Zoom in">+</button>
      <button id="zoomResetBtn" class="zoom-btn zoom-reset" title="Reset zoom" aria-label="Reset zoom">↺</button>
    </div>

    <header class="hero">
      <div>
        <p class="eyebrow">ផ្សាររឡឺសាលួស</p>
        <h1>តារា សាឡឺ</h1>
        <p>
          មានលក់ ទា ត្រីមូល ត្រីឆ្លាត គូទមាន់ ស្លាបមាន់ ស្លាបខ្លី កោះមាន់ ភ្លៅមាន់ ជើងមាន់ បន្លែ នំឈីស មីសួរដើម មីសួរដើមតូច គ្រាប់ខ្នុល ក្រពេះ ប្រហិត
          នំបញ្ចុក បាញ់ស៊ុង បាញ់ហយ.......
        </p>
        <div class="contact-info">
          <a class="contact-pill" href="tel:+855978858784" aria-label="Call phone number">
            <span class="icon">📞</span>
            <span>097 885 8784</span>
          </a>
          <a class="contact-pill" href="https://t.me/tdr1909" target="_blank" rel="noopener noreferrer" aria-label="Open Telegram">
            <span class="icon">✈️</span>
            <span>@tdr1909</span>
          </a>
          <a class="contact-pill" href="https://maps.app.goo.gl/LGfphF2XiW3NbXt19?g_st=atm" target="_blank" rel="noopener noreferrer" aria-label="Open location">
            <span class="icon">📍</span>
            <span>Location</span>
          </a>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <div class="role-bar" id="roleLoginBar">
          <button type="button" class="role-btn is-active" data-role="customer">Customer</button>
          <button type="button" class="role-btn" data-role="owner">Owner</button>
          <button type="button" class="role-btn" data-role="admin">Admin</button>
          <button type="button" class="role-btn" data-role="dev">Dev</button>
        </div>

        <div id="loginPanel" class="login-panel hidden" aria-live="polite">
          <div class="login-panel-header">
            <strong id="loginTitle">Owner login</strong>
          </div>
          <div class="login-form-grid">
            <label>
              Login name
              <input id="loginName" type="text" placeholder="Enter login name" />
            </label>
            <label>
              Password
              <input id="loginPassword" type="password" placeholder="Enter password" />
            </label>
          </div>
          <div class="login-actions">
            <button id="loginSubmit" type="button">Login</button>
            <button id="loginCancel" class="secondary" type="button">Cancel</button>
          </div>
          <p id="loginStatus" class="login-status"></p>
        </div>

        <h2>មុខទំនិញ</h2>
        <div class="search-container">
          <input id="searchItems" type="text" placeholder="Search items by name..." class="search-input" />
        </div>
        <div id="itemsGrid" class="items-grid"></div>
      </section>

      <section class="card receipt-card">
        <h2>Customer receipt</h2>
        <form id="receiptForm" class="form-grid">
          <label>
            customer name
            <input id="customerName" type="text" placeholder="customer name" required />
          </label>
          <label>
            item
            <select id="receiptItem" required></select>
          </label>
          <label>
            quantity
            <input id="receiptQty" type="number" min="1" value="1" required />
          </label>
          <button type="submit">Add item</button>
        </form>

        <div class="receipt-actions">
          <button type="button" id="createReceiptBtn">Create receipt</button>
          <button type="button" id="resetReceiptBtn" class="secondary">Reset receipt</button>
        </div>

        <div class="receipt-actions">
          <button type="button" id="downloadWord" class="secondary">Download Word</button>
          <button type="button" id="downloadExcel" class="secondary">Download Excel</button>
          <button type="button" id="printReceipt" class="secondary">Print</button>
          <button type="button" id="viewHistory" class="secondary">View History</button>
        </div>

        <div id="receiptPreview" class="receipt"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
